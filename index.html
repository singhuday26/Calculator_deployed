<!doctype html>
<html lang="en">
  <head>
    <!--
      ==========================================================================
      INDEX.HTML — The Single Entry Point
      ==========================================================================

      In a Single Page Application (SPA), there's only ONE HTML file.
      Everything else is generated by JavaScript at runtime.

      HOW VITE USES THIS FILE:
      1. During DEV: Vite serves this file and injects <script> tags
      2. During BUILD: Vite processes this file, resolves all imports,
         and outputs optimized files to dist/

      The <script type="module" src="/src/main.tsx"> at the bottom
      is where your entire React app starts.
      ==========================================================================
    -->

    <meta charset="UTF-8" />

    <!-- Viewport meta tag — CRITICAL for mobile responsiveness -->
    <!-- width=device-width: match screen width (not a desktop viewport) -->
    <!-- initial-scale=1.0: no zoom on load -->
    <!-- viewport-fit=cover: extend into notch area on modern phones -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Prevent phone number auto-detection on iOS (we don't want calculator numbers to become links) -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme color — colors the browser chrome (address bar) on mobile -->
    <meta name="theme-color" content="#1a1a2e" />

    <!-- App description for SEO and social sharing -->
    <meta name="description" content="A beautiful, production-grade calculator app" />

    <!-- PWA: Link to web app manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apple Touch Icon for iOS home screen -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Apple-specific PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calculator" />

    <title>Calculator</title>
  </head>
  <body>
    <!--
      THE ROOT DIV
      React will mount your entire application inside this div.
      Before JavaScript loads, this is empty — that's why SPAs
      sometimes show a blank screen briefly (the "flash").

      PRODUCTION TIP: Add a loading indicator here for better UX:
      <div id="root"><div class="loading">Loading...</div></div>
      React will replace the contents once it mounts.
    -->
    <div id="root"></div>

    <!--
      type="module" tells the browser this is an ES Module.
      Vite leverages native ES module support in modern browsers
      for lightning-fast development (no bundling during dev!).
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
