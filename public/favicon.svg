<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Calculator App Icon -->
  <!-- A clean, modern calculator icon with a gradient background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5a67d8"/>
      <stop offset="100%" style="stop-color:#4a57c8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Display area -->
  <rect x="80" y="70" width="352" height="100" rx="20" fill="rgba(0,0,0,0.2)"/>
  <text x="400" y="145" fill="white" font-family="system-ui" font-size="56" font-weight="300" text-anchor="end">42</text>

  <!-- Button grid (simplified 3x3 representation) -->
  <!-- Row 1 -->
  <rect x="80" y="200" width="80" height="65" rx="12" fill="rgba(255,255,255,0.2)"/>
  <rect x="175" y="200" width="80" height="65" rx="12" fill="rgba(255,255,255,0.2)"/>
  <rect x="270" y="200" width="80" height="65" rx="12" fill="rgba(255,255,255,0.2)"/>
  <rect x="365" y="200" width="67" height="65" rx="12" fill="rgba(255,149,0,0.8)"/>

  <!-- Row 2 -->
  <rect x="80" y="280" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="175" y="280" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="280" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="365" y="280" width="67" height="65" rx="12" fill="rgba(255,149,0,0.8)"/>

  <!-- Row 3 -->
  <rect x="80" y="360" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="175" y="360" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="360" width="80" height="65" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="365" y="360" width="67" height="65" rx="12" fill="rgba(255,149,0,0.8)"/>

  <!-- Row 4 (with wide 0 button) -->
  <rect x="80" y="440" width="175" height="55" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="270" y="440" width="80" height="55" rx="12" fill="rgba(255,255,255,0.15)"/>
  <rect x="365" y="440" width="67" height="55" rx="12" fill="rgba(90,103,216,0.9)"/>
</svg>
